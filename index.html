<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142b28" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Crie um checklist, compartilhe um link e organize tudo junto com sua equipe. Sem cadastro."
    />
    <title>Checklist Pro — organize juntos</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("checklist-pro-theme") === "dark"
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
